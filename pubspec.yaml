name: cinesnap
description: "CineSnap - Share your screen. Connect through cinema."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  google_sign_in: ^6.2.2
  http: ^1.3.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  provider: ^6.1.5
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  supabase_flutter: ^2.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
